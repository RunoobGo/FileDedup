name: Build Wails App

on:
  push:
    tags:
      - 'v*'           # 推送 v1.0.0 等标签时自动构建并发布 Release
  workflow_dispatch:   # 允许在 GitHub 网页端手动点击触发

jobs:
  # ================= 0. 发布门槛：tag 必须指向已过 CI 的提交（J-2=(b)，R-门禁-2） =================
  # 背景：ci.yml 的触发是 `push.branches:[main]` + `pull_request`，**tag push 不触发
  # ci.yml**。因此本发布流水线（on.push.tags:v*）过去对「这个提交到底过没过 CI」一无
  # 所知——可以给任意一个从没跑过 CI 的提交打 v* tag，四腿照样出包并（改前）直接发公开
  # Release。J-2=(b) 的裁定是把发布门槛**收紧到与 CI 等价**：tag 指向的提交必须有一次
  # name=="CI" 且 conclusion=="success" 的 run，否则拒绝构建。
  #
  # 只在 tag 触发时真正判定：非 tag 触发（workflow_dispatch）下 `if:` 为 false → 该 step
  # 跳过 → 本 job 仍 success → 下游 build 的 `needs` 满足，手动演练不受影响。
  verify-ci:
    name: Verify Tag Commit Passed CI
    runs-on: ubuntu-latest
    timeout-minutes: 5   # 只做一次 API 查询，5 分钟已是极宽上限
    permissions:
      actions: read      # 查 workflow runs 所需的最小权限
      contents: read
    steps:
      - name: Check CI status for tag commit
        if: startsWith(github.ref, 'refs/tags/v')
        # AS-K4 同款纪律：不把事件字段插值进 shell（run 块内只用 env 暴露的变量），
        # 避免 tag/ref 名里若含特殊字符造成 shell 注入。
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Tag push detected. Verifying commit ${SHA} in ${REPO} passed CI before building a release."
          RUNS_JSON=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100")
          CONCLUSION=$(printf '%s' "$RUNS_JSON" | jq -r '[.workflow_runs[] | select(.name=="CI")] | sort_by(.created_at) | last | .conclusion // empty')
          if [ -z "$CONCLUSION" ]; then
            echo "::error::No CI workflow run found for commit ${SHA}. A release tag must point to a commit that passed CI on main."
            exit 1
          fi
          echo "Latest CI run conclusion for ${SHA}: ${CONCLUSION}"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CI for commit ${SHA} concluded '${CONCLUSION}' (need 'success'). Refusing to build/publish a release from a commit that did not pass CI."
            exit 1
          fi
          echo "OK: commit ${SHA} passed CI. Release gate satisfied."

  build:
    name: Build - ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    needs: verify-ci
    # M120（04 §6.11 GATE-4）：AS-K5 那条纪律在 ci.yml:37-42 写死了理由——没有
    # timeout-minutes 的作业一旦某步卡住就烧满 6 小时平台默认上限，还把已产出的
    # 日志一起废掉。那条只套了 CI，发布流水线改前是零处。四平台矩阵含 Wails 打包，
    # 给 40 分钟（本机那一跑约 8 分钟量级，留足 runner 冷启动与下载）。
    # ★ 本机无 runner ⇒ "改对了"这一格未兑现，只能等一次 tag/手动触发。
    timeout-minutes: 40
    permissions:
      contents: read   # 最小权限：仅 release job 需要 contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Linux AMD64
          # webkit2_41：wails v2.16 仅按构建标签选择 WebKit 4.1（ubuntu-24.04 无 4.0 包，
          # 且 wails doctor 的依赖表只认 4.0 包名，报 Not Found 属显示局限，非真实缺失）
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            go_tags: webkit2_41
            asset_name: FileDedup-linux-amd64
            archive_name: FileDedup-linux-amd64.tar.gz
          # 2. Windows AMD64
          - os: windows-latest
            platform: windows
            arch: amd64
            asset_name: FileDedup-windows-amd64
            archive_name: FileDedup-windows-amd64.zip
          # 3. macOS ARM64 (Apple Silicon M1/M2/M3)
          - os: macos-14
            platform: darwin
            arch: arm64
            asset_name: FileDedup-macos-arm64
            archive_name: FileDedup-macos-arm64.zip
          # 4. macOS AMD64 (Intel)：macos-13 已退役，用 macos-15-intel
          - os: macos-15-intel
            platform: darwin
            arch: amd64
            asset_name: FileDedup-macos-amd64
            archive_name: FileDedup-macos-amd64.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # ================= 1. Linux 系统依赖 (修复 Exit Code 1) =================
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # ubuntu-24.04：wails v2 要求 WebKit 4.1，无 4.0 包，不做回退（回退只会把错误推迟到 wails build）
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev

      # ================= 2. 前端构建 =================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: ./frontend
        shell: bash
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi
          npm run build

      # ================= 3. Go & Wails 环境 =================
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod   # 与 go.mod 保持一致，勿硬编码版本
          cache: true

      # B3-5 发布门禁第一道：6 个取值位版本号必须对齐，且 **tag 触发时 tag 必须
      # 等于 v<AppVersion>**。不把事件字段插值进 shell——脚本自行读
      # GITHUB_REF_TYPE / GITHUB_REF_NAME / GITHUB_REF。
      #
      # ★ AS-K4：上面的 `on.push.tags: v*` 是**故意放宽**的。收窄成 v[0-9]* 只会
      # 让 vBeta 这类标签静默不跑流水线（没人收到红），而门禁的作用是让打错标签
      # 的人**看见**自己打错了。判定改看触发类型而非标签拼写，因此 v* 触发的
      # 任何标签都会在此被比对，对不上即 fail。
      #
      # ★ 位置与腿数（2026-09-24，run 36013091891 三腿红的复盘）：本步原来排在
      #   Setup Go **之前**且四腿都跑，但脚本 B3/§7 的真值通道要 `go list`——
      #   macOS runner 无预装 go（`command not found`）、windows 腿 Git Bash 下
      #   go list 取空，只有 linux 腿靠 runner 预装 go 侥幸绿。该检查是平台无关
      #   的「文档 vs 源码」对账，无需四腿重复。现移到 Setup Go 之后（用 go.mod
      #   指定的 go，不再赌 runner 预装版本），并与 CLI Smoke 同款只在 linux 一腿
      #   跑一次（口径对齐 ci.yml:72-73 的 ubuntu 单跑）。linux 是发布产物腿之一，
      #   tag 触发时此门照样拦，门禁语义不减。
      - name: Version Sync Check
        if: matrix.platform == 'linux'
        shell: bash
        run: bash scripts/check-version-sync.sh

      - name: Install Wails CLI
        # 固定与 go.mod 相同的 wails 版本，避免 @latest 与项目版本漂移
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # ================= 4. Go 测试（发布门槛） =================
      - name: Run Go Tests
        if: matrix.platform != 'windows'
        run: go test -count=1 ./...

      # B3-4：Windows 测试改为阻断式白名单门禁。原先 continue-on-error 让整个
      # 平台的测试不设防（任何回归都被"仅告警"吞掉）。现在只有清单内逐条列明
      # 原因的用例被隔离，其余失败直接断掉发布构建。
      - name: Run Go Tests (Windows, quarantined)
        if: matrix.platform == 'windows'
        run: bash scripts/test-windows-quarantine.sh

      # B3-4：发布构建补数据正确性冒烟（回归配方第 6 步，见 docs/archive/里程碑开发与测试报告.md 第 4 篇 §7.5）。只在 linux
      # 一腿跑一次：冷扫 / 缓存首扫 / 缓存复扫三跑逐项一致，并与 benchgen
      # manifest 对账（漏报无法靠互比发现，必须对期望值）。
      - name: CLI Smoke (cold / cache / warm-cache)
        if: matrix.platform == 'linux'
        run: bash scripts/smoke-cli.sh

      # ================= 5. Wails 编译 (带详细诊断) =================
      - name: Build Wails Binary
        shell: bash
        env:
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
          GO_TAGS: ${{ matrix.go_tags }}
        run: |
          # 打印环境诊断信息，方便排查
          wails doctor || true

          # 注意：-v 是 int 型 flag（0/1/2），裸 -v 会报 "flag needs an argument"
          wails build -clean -s -skipbindings -ldflags "-s -w" -tags "$GO_TAGS"

          echo "✅ Build output:"
          ls -la build/bin/

      # ================= 6. 打包 =================
      - name: Package Artifact
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE_NAME: ${{ matrix.archive_name }}
        run: |
          if [ "$PLATFORM" == "darwin" ]; then
            # macOS：打包完整 .app bundle（保留 Info.plist/图标），不用 find 挑裸二进制
            [ -d "build/bin/FileDedup.app" ] || { echo "❌ build/bin/FileDedup.app not found"; exit 1; }
            zip -ry "$ARCHIVE_NAME" build/bin/FileDedup.app
          else
            # 自动查找 build/bin 下的可执行文件。
            # R-门禁-6：旧写法 `find ... | head -1` 在命中多个时**静默取第一个**（find 顺序不保证），
            # 可能打包到错误的产物（如残留的旧二进制）。改成显式断言"恰好一个"——0 个或 >1 个都 fail。
            MATCHES=$(find build/bin -type f \( -name "FileDedup*" -o -name "filededup*" \))
            COUNT=$(printf '%s\n' "$MATCHES" | grep -c . || true)
            if [ "$COUNT" -eq 0 ]; then
              echo "❌ Binary not found in build/bin/"
              exit 1
            fi
            if [ "$COUNT" -gt 1 ]; then
              echo "❌ Expected exactly 1 binary in build/bin/, found $COUNT:"
              printf '%s\n' "$MATCHES"
              exit 1
            fi
            BINARY="$MATCHES"

            if [ "$PLATFORM" == "windows" ]; then
              powershell -Command "Compress-Archive -Path '$BINARY' -DestinationPath '$ARCHIVE_NAME'"
            else
              tar -czf "$ARCHIVE_NAME" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
            fi
          fi

      # ================= 7. 上传产物 =================
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.archive_name }}
          retention-days: 7

  # ================= 8. 自动发布 Release =================
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15   # M120：只做"下载产物 + 建 release"，15 分钟足够宽
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # 04 附录 A「SHA-256 checksum 文件」：随 Release 一并发布，用户可比对下载完整性
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          # R-门禁-6：checksum 点数必须**等于矩阵腿数**。download-artifact 的 merge-multiple
          # 少收一条腿的产物时，旧写法 `sha256sum FileDedup-*` 会照少数几个文件生成 checksums、
          # release 照发——缺腿被静默吞掉。这里显式点数，对不上即 fail。
          shopt -s nullglob
          files=(FileDedup-*)
          shopt -u nullglob
          expected=4   # 矩阵腿数（build.yml 四平台 include）；增删平台时同步改这里
          if [ "${#files[@]}" -ne "$expected" ]; then
            echo "::error::Expected $expected release artifacts (matrix legs), got ${#files[@]}: ${files[*]:-<none>} — some build leg's artifact did not make it into the release set"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          lines=$(wc -l < SHA256SUMS.txt | tr -d ' ')
          if [ "$lines" -ne "$expected" ]; then
            echo "::error::SHA256SUMS.txt has $lines lines, expected $expected (one per leg) — checksum set does not match artifact set"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          # J-1=(a)（R-门禁-1）：release 腿是全仓唯一不可逆的对外动作。改前 v* tag
          # 一推就直接建**公开** Release，无任何人工闸——打错 tag、产物损坏、checksum
          # 对不上都已对外可见且难撤。加 draft: true 后，tag 触发只建**草稿** Release：
          # 四腿产物与 SHA256SUMS.txt 齐了，但需人在 GitHub 上核对无误后手点 Publish
          # 才公开。演练/回退都在草稿态完成，不外泄。
          draft: true
