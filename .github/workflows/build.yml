name: Build & Package FileDedup

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build - ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest       # Apple Silicon (M1/M2/M3)
            goos: darwin
            goarch: arm64
            asset_name: FileDedup-macos-arm64
            archive_ext: .zip
          - os: macos-13           # Intel Mac
            goos: darwin
            goarch: amd64
            asset_name: FileDedup-macos-amd64
            archive_ext: .zip
          - os: ubuntu-latest      # Linux AMD64
            goos: linux
            goarch: amd64
            asset_name: FileDedup-linux-amd64
            archive_ext: .tar.gz
          - os: windows-latest     # Windows AMD64
            goos: windows
            goarch: amd64
            asset_name: FileDedup-windows-amd64
            archive_ext: .zip
            is_windows: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ========== 1. 系统依赖 (Wails 需要) ==========
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config

      # ========== 2. 构建前端 ==========
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi
          npm run build
        shell: bash

      # ========== 3. 构建 Wails 应用 ==========
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1   # ⚠️ Wails 桌面应用必须开启 CGO
        run: |
          # -s: 跳过前端构建(已在上面完成)
          # -clean: 清理旧产物
          # -skipbindings: 跳过绑定生成(CI中不需要)
          wails build -clean -s -skipbindings -ldflags "-s -w"

          # Wails 输出到 build/bin/，提取二进制文件
          BINARY=$(find build/bin -type f -name "FileDedup*" -o -name "filededup*" | head -1)
          if [ -z "$BINARY" ]; then
            echo "❌ Error: Built binary not found in build/bin/"
            ls -la build/bin/
            exit 1
          fi
          cp "$BINARY" FileDedup_bin
          echo "✅ Built: $BINARY"
        shell: bash

      # ========== 4. 打包 ==========
      - name: Package Artifact
        run: |
          ARCHIVE="${{ matrix.asset_name }}${{ matrix.archive_ext }}"
          if [ "${{ matrix.is_windows }}" == "true" ]; then
            powershell -Command "Compress-Archive -Path 'FileDedup_bin' -DestinationPath '$ARCHIVE'"
          elif [ "${{ matrix.archive_ext }}" == ".tar.gz" ]; then
            tar -czf "$ARCHIVE" "FileDedup_bin"
          else
            zip -r "$ARCHIVE" "FileDedup_bin"
          fi
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}${{ matrix.archive_ext }}
          retention-days: 7

  # ========== 5. 自动发布 Release ==========
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
