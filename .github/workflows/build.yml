name: Build Wails App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build - ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            asset_name: FileDedup-linux-amd64
            archive_name: FileDedup-linux-amd64.tar.gz
          - os: windows-latest
            platform: windows
            arch: amd64
            asset_name: FileDedup-windows-amd64
            archive_name: FileDedup-windows-amd64.zip
          - os: macos-14
            platform: darwin
            arch: arm64
            asset_name: FileDedup-macos-arm64
            archive_name: FileDedup-macos-arm64.zip
          - os: macos-13
            platform: darwin
            arch: amd64
            asset_name: FileDedup-macos-amd64
            archive_name: FileDedup-macos-amd64.zip

    steps:
      # ✅ 升级到 v5 以消除 Node.js 20 废弃警告
      - name: Checkout Code
        uses: actions/checkout@v5

      # ================= 1. Linux 系统依赖 (修复 Exit Code 100) =================
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # 尝试安装 4.1，如果失败则回退到 4.0；安装完整编译工具链
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev || true
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev

      # ================= 2. 前端构建 =================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # ✅ 升级到 Node 22 LTS
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: ./frontend
        shell: bash
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi
          npm run build

      # ================= 3. Go & Wails 环境 =================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'  # ✅ 升级 Go 版本
          cache: false        # ✅ 禁用缓存以修复 macOS gtar exit code 2 错误

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # ================= 4. Wails 编译 =================
      - name: Build Wails Binary
        shell: bash
        env:
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          wails build -clean -s -skipbindings -ldflags "-s -w"
          
          echo "✅ Build output:"
          ls -la build/bin/

      # ================= 5. 打包 =================
      - name: Package Artifact
        shell: bash
        run: |
          BINARY=$(find build/bin -type f \( -name "FileDedup*" -o -name "filededup*" \) | head -1)
          
          if [ -z "$BINARY" ]; then
            echo "❌ Binary not found in build/bin/"
            exit 1
          fi
          
          if [ "${{ matrix.platform }}" == "windows" ]; then
            powershell -Command "Compress-Archive -Path '$BINARY' -DestinationPath '${{ matrix.archive_name }}'"
          elif [[ "${{ matrix.archive_name }}" == *.tar.gz ]]; then
            tar -czf "${{ matrix.archive_name }}" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
          else
            zip -j "${{ matrix.archive_name }}" "$BINARY"
          fi

      # ✅ 升级到 v5 消除警告
      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.archive_name }}
          retention-days: 7

  # ================= Release =================
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
