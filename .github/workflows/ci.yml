# CI 流水线（04 §4：PR 检查阶段）
#
# 三条腿（2026-09-21 起）：
#   check   ubuntu —— gofmt + 跨平台 vet + go test -race（全包 count=2 / 根包 count=4）
#                   + 前端 typecheck/build/逻辑探针 + CLI 冒烟三跑比对 + 跨卷软链接冒烟
#   windows windows —— 隔离清单后的 go test（含 fsid 句柄身份用例）
#   macos   macos-latest —— 本机 vet + go test -race（同 ubuntu 配方）+ CLI 冒烟
#                       （D-2：darwin 专属代码此前只有交叉 vet，从没真跑过一次）
#
# 顺序约束（勿调换）：main.go 使用 `//go:embed frontend/dist`，
# 而 frontend/dist 属构建产物（.gitignore 排除），因此必须先构建前端，
# 否则 go vet / go test 会因 embed 找不到目录而失败。
#
# 本流水线不依赖 wails CLI：前端由 npm 直接构建，后端由 go 直接编译。
#
# 尚未纳入（原因见同文 §7.5 与 docs/04 §4.3）：
#   - eslint：前端未配置 lint 规则集
#   - 契约 diff 检查：需专门的"Go json tag ↔ TS 接口"校验器（尚未实现）
#   - macOS/Linux 真实回收站与 GUI 端到端：需人工或桌面会话
#   - macOS 侧跨卷冒烟：harness 依赖 losetup/mount -o loop，仅 Linux 可用

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gofmt / vet x3 / test -race / frontend / smoke
    runs-on: ubuntu-latest
    # ★ AS-K5（2026-09-20 全仓审计）：没有 timeout-minutes 的作业，一旦某步卡住
    # （挂载点半死、loop 设备等待、npm 网络挂起）会一直占到 GitHub 的 6 小时上限，
    # 期间吃掉 runner 配额，且被平台杀掉时**没有可读的失败原因**。
    # 作业级兜底 + 下面两处易阻塞调用的 step 级 timeout 双保险：后者只红那一步，
    # 不至于把前面已跑完的步骤一起废掉。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请执行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      # B3-5：版本号声明位（app.go / wails.json / package{,-lock}.json / docs/09）
      # 必须互相对齐；tag 触发时脚本自解析 GITHUB_REF_NAME 再比对 tag。
      - name: 版本号一致性检查
        run: bash scripts/check-version-sync.sh

      - name: 前端类型检查（vue-tsc）
        working-directory: frontend
        run: npm ci && npm run typecheck

      # M15：前端纯逻辑行为探针（零依赖：Node 自带 TS 类型剥离 + test runner）。
      # 与 vue-tsc 的分工——类型检查只证明"能编译"，证明不了"界面上的句子是真的"；
      # M15 那类缺陷（确认框对 hardlink 说"可释放"、结果条同一件事说"占用不变"）
      # 在 vue-tsc 下永远全绿。
      # ★ 脚本用 rc=2 表示"本机跑不了"（无 node / node 过旧）。在 CI 上这不是可放行的
      #   合法状态：node 由 setup-node 钉住，出现 2 即环境退化，必须红
      #   （教训同 smoke-symlink-assert：跳过与全绿同形会让防线静默消失）。
      #   步骤在默认 `bash -e` 下执行，1 与 2 都会让本步失败。
      - name: 前端逻辑探针（test-frontend-logic）
        run: bash scripts/test-frontend-logic.sh

      - name: 前端构建（须先于 Go 步骤：go:embed 依赖 frontend/dist）
        working-directory: frontend
        run: npm run build

      - name: go vet（本机 linux）
        run: go vet ./...

      # 跨平台 vet：本平台 runner 无法跑 Windows 测试，但至少保证 Windows 分支
      # 能编译且通过静态检查（fsid 句柄查询、路径处理等 build tag 分文件）。
      - name: go vet（GOOS=windows）
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: go vet（GOOS=darwin）
        run: GOOS=darwin GOARCH=arm64 go vet ./...

      - name: go test -race -count=2
        run: go test -race -count=2 ./...

      # 根包（App 层）与事件/互斥状态机耦合最紧，单独多跑两轮压竞态窗口
      - name: go test -race -count=4（根包）
        run: go test -race -count=4 .

      # CLI 冒烟：固定数据集上「冷扫 / 缓存首扫 / 缓存复扫」三次结果必须逐项一致，
      # 断言口径是分组路径集合与可释放字节（files_total 属阶段口径，见脚本说明）。
      - name: CLI 冒烟（benchgen C×0.02 + fdd-cli 三跑比对）
        # 三跑各带一次全量哈希，慢盘上会明显变长；给足余量，但仍不许无限期占着。
        # 外层 20 > 内层 900s：让**内层**先响，它才有"超时"这条可读的错误分支。
        timeout-minutes: 20
        run: timeout --signal=TERM --kill-after=30s 900s bash scripts/smoke-cli.sh

      # 跨卷软链接冒烟（2026-09-20）：挂一个独立文件系统，实证 7 条判据
      # （① 硬链接跨卷必失败——本功能存在的理由 ② 软链接跨卷成功且内容跟随
      # ③ 链接自身占用远小于数据 ④ 删除链接不影响保留源 ⑤ 保留源移动后链接悬空
      # ⑥ 回撤还原为独立文件 ⑦ 悬空仍可回撤）。
      # 单测里的"跨卷"其实是同卷模拟（两个 t.TempDir 在同一设备上），
      # 真实跨设备语义只有这一步能覆盖。
      #
      # ★ 2026-09-20（审查 M8）：脚本的跳过退出码由 0 改为 2，这里必须**按码分流**。
      # 修正前脚本跳过也 exit 0，而本步骤只 `sudo bash …` 看退出码——于是
      # "runner 挂不上任何文件系统"与"7 条判据全部成立"都是绿：这条唯一的
      # 真实跨卷防线可以在无人察觉时失效。现在 rc=2 仍不阻断（环境受限不该
      # 怪代码），但会在作业摘要与日志里留下**醒目告警**，不再与全绿同形。
      #
      # ★ M133（04 §6.11 GATE-7，设计段随 §23.9 一并记）：上面那段只解决了"跳过与
      # 全绿同形"，没解决"真失败与跳过同形"。smoke-symlink.sh 自己的契约（:19-22、
      # skip():56-59）是**两件事同真**——"SKIP（跳过，非通过）:" 前缀 + 退出码 2，
      # 而本步骤改前只认裸 rc=2；该脚本整体是 `set -euo pipefail`，中途任何命令以 2
      # 退出（mount 参数错、grep 读不出）都会在这里被降级成"被跳过 + 告警"、作业仍绿。
      # 本地那份 harness 同一格已按 M123 补成双条件，这里补齐云端这一半。
      - name: 跨卷软链接冒烟（独立卷 + 7 条判据）
        timeout-minutes: 10
        run: |
          set +e
          # step 级 timeout（AS-K5）：mount/losetup 坏的时候是**阻塞**而不是报错，
          # 只靠作业级 timeout-minutes 会把整个 job 连日志一起废掉。
          # M133：输出一份留档，供 rc=2 那一格核对自证标记（PIPESTATUS 取 timeout 的码，
          # 不是 tee 的——取错就变成"只要 tee 成功就算通过"）。
          timeout --signal=TERM --kill-after=30s 420s \
            sudo bash scripts/smoke-symlink.sh 2>&1 | tee /tmp/smoke-symlink.log
          rc=${PIPESTATUS[0]}
          set -e
          case "$rc" in
            0) echo "跨卷软链接 7 条判据全部成立" ;;
            124|137|143) msg="跨卷软链接冒烟超时（420s 未完成，rc=${rc}）——多半是 mount/losetup 阻塞"
               echo "::error::$msg"
               {
                 echo '## ⏱ 跨卷软链接冒烟超时'
                 echo
                 echo "$msg"
                 echo "超时按失败处理：阻塞与判据不成立都需要人来看。"
               } >>"$GITHUB_STEP_SUMMARY"
               exit 1 ;;
            2) if ! grep -q '^SKIP' /tmp/smoke-symlink.log; then
                 echo "::error::rc=2 但输出里没有以 SKIP 开头的那行自证 ⇒ 按真失败判，不降级为跳过（M133）"
                 exit 1
               fi
               msg="跨卷软链接冒烟被跳过（runner 无法挂载独立文件系统）——该防线本轮未被执行，不等于通过"
               echo "::warning title=冒烟未执行::$msg"
               {
                 echo '## ⚠️ 跨卷软链接冒烟未执行'
                 echo
                 echo "$msg"
                 echo
                 echo "判据 ①「硬链接跨卷必失败」只能在真实独立卷上实证，"
                 echo "同卷环境下无法降级验证。请检查 runner 的 loop/tmpfs 可用性。"
               } >>"$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::跨卷软链接冒烟失败（rc=${rc}）"; exit "$rc" ;;
          esac

      # 冒烟脚本自身的判据（退出码契约 + loop 设备不泄漏 + 失败信息可排查）。
      # 不需要 root：它用桩命令驱动 smoke-symlink.sh 的各分支。
      - name: 冒烟脚本判据自证（smoke-symlink-assert）
        run: bash scripts/smoke-symlink-assert.sh

  windows:
    name: go test (windows)
    runs-on: windows-latest
    # AS-K5：Go 编译 + 前端构建 + 全量测试，无上限时会静默占满 runner 配额
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 前端产物：main.go 的 go:embed 需要 frontend/dist（本 job 不跑 npm，
      # 只测不含 embed 依赖的内部包之外仍需可编译，故直接构建一次 dist）
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端构建
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 白名单式隔离：清单内的历史失败暂不阻断，其余一律阻断（含 fsid 的
      # Windows 句柄身份用例，I7 的真实验证入口）
      - name: go test（隔离清单见 scripts/test-windows-quarantine.sh）
        run: bash scripts/test-windows-quarantine.sh

  # D-2（2026-09-21）：此前 CI 只有 `GOOS=darwin go vet`——**交叉 vet 只证明能编译**，
  # darwin 专属代码（internal/ops/trash_darwin.go、internal/media/probe_darwin.go、
  # internal/fsid/fsid_darwin.go 及其 15 个 *_darwin_test.go）从没有在真实 macOS 上
  # 跑过一次。与 windows 腿同一逻辑：该平台是**交付目标**，就必须有一条真跑的腿。
  #
  # 本地（darwin/arm64，与 macos-latest 同 GOOS/GOARCH）先行取证：
  #   go vet ./...                          → rc=0
  #   go test -race -count=2 ./...          → 17 包全 ok
  #   go test -list '^Test' ./...           → 471（与 §3.2 交叉核对表的 darwin 值一致）
  #   bash scripts/smoke-cli.sh             → rc=0，205 组 / 90,522,243 B / 2,360 文件 /
  #                                            复扫命中 532，三跑一致
  # 首跑仍需一次真实 push 才能确认 runner 侧（Xcode/CGO、配额、时长）成立。
  #
  # 〔2026-09-22 对齐（M100/M108），上面四行是 2026-09-21 的原读数、不删只补：〕
  #   ① "首跑"这一格**已兑现**：macOS 腿此后反复真跑，且已抓红过一次
  #      （run 35644606017 的 step7 判 TestScanAndOpsAreMutuallyExclusive DATA RACE）。
  #   ② 包数与用例数都漂了：现值 `go test -race -count=2 ./...` = 22 包 ok、
  #      `go test -list '^Test' ./...` = 654 条（两值同批重取，见 04 §3.2 第五次核对）。
  #   ③ 注释里"15 个 *_darwin_test.go"现为 darwin 专属 17 条（新增 cloudfile 1、
  #      realbytes clone 取证 1）。
  #   ④ 本地全套门禁的**唯一入口**已改成 `bash scripts/run-gates.sh`（15 行读数，
  #      自带总判定与非 0 退出码）；本注释里的四行命令是它 2026-09-21 的手工前身。
  macos:
    name: go test (macos)
    runs-on: macos-latest
    # 与 windows 腿同档：编译 + 前端构建 + 全量测试。给 35 分钟，超时即红，
    # 不靠脚本自带 timeout（见下一步注释）。
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 与 check job 同一条 embed 约束：根包的 go test 需要 frontend/dist 已存在。
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 前端构建（go:embed 前置）
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: go vet（本机 darwin，非交叉）
        run: go vet ./...

      - name: go test -race -count=2
        run: go test -race -count=2 ./...

      # 根包（App 层）与事件/互斥状态机耦合最紧，多跑两轮压竞态窗口（与 linux 腿同配方）
      - name: go test -race -count=4（根包）
        run: go test -race -count=4 .

      # 确定性 E2E 三跑对账。刻意**不加** `timeout …` 前缀：GNU timeout 不在 macOS
      # 默认环境里，命令不存在时这一步会以 127 红在"缺工具"上而不是红在"结果不一致"上。
      # 时长保护由上面的 step 级 timeout-minutes 承担。
      - name: CLI 冒烟（benchgen C×0.02 + fdd-cli 三跑比对）
        timeout-minutes: 20
        run: bash scripts/smoke-cli.sh

      # 刻意不跑 smoke-symlink*.sh：整套 harness 是 Linux 专属（losetup/mount -o loop/
      # stat -c/sha256sum），在 macOS 上会以"环境受限" rc=2 收尾。按 AS-K2 的口径，
      # 一条恒为"跳过"的步骤不叫覆盖，写在这里只会被读成 mac 侧验过跨卷语义。

